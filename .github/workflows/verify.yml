name: Verify and package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # macOS 只在本机构建（Actions 额度），见 AGENTS.md
        include:
          - os: windows-latest
            bundle: nsis
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run tauri build --bundles ${{ matrix.bundle }}
      - name: Verify and name Windows x64 installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes('src-tauri/target/release/ssot-hub.exe')
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Application is not x64' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/bundle/nsis/SSOT Hub_${version}_x64-setup.exe" 'SSOT.Hub.windows.x64.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: SSOT-Hub-${{ matrix.name }}
          path: SSOT.Hub.windows.x64.exe
          if-no-files-found: error
