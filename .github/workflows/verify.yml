name: Verify and package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Package Web/PWA
        run: cd dist && zip -r ../SSOT.Hub.web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: SSOT-Hub-Web
          path: SSOT.Hub.web.zip
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            name: macOS-arm64
          - os: windows-latest
            bundle: nsis
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run tauri build --bundles ${{ matrix.bundle }}
      - name: Verify and archive macOS ARM64 app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='src-tauri/target/release/bundle/macos/SSOT Hub.app'
          test "$(lipo -archs "$app/Contents/MacOS/ssot-hub")" = arm64
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          tar -czf SSOT.Hub.macos.arm64.tar.gz -C src-tauri/target/release/bundle/macos 'SSOT Hub.app'
      - name: Verify and name Windows x64 installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes('src-tauri/target/release/ssot-hub.exe')
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Application is not x64' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/bundle/nsis/SSOT Hub_${version}_x64-setup.exe" 'SSOT.Hub.windows.x64.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: SSOT-Hub-${{ matrix.name }}
          path: |
            SSOT.Hub.macos.arm64.tar.gz
            SSOT.Hub.windows.x64.exe
          if-no-files-found: error
