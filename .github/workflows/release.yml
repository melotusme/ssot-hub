# Manual preview release. The repository is public, so Actions (including macOS) are free.
name: Publish preview release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.2-preview.1 (must match package.json version)
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          case "$TAG" in "v$version" | "v$version"-preview.[0-9]*) ;; *) echo "tag $TAG does not match version $version"; exit 1 ;; esac
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run tauri build --bundles ${{ matrix.bundle }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/release/bundle/macos
          [ "$(lipo -archs 'SSOT Hub.app/Contents/MacOS/ssot-hub')" = arm64 ]
          codesign --verify --deep --strict 'SSOT Hub.app'
          tar -czf "$GITHUB_WORKSPACE/SSOT.Hub.macos.arm64.tar.gz" 'SSOT Hub.app'
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes('src-tauri/target/release/ssot-hub.exe')
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Application is not x64' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/bundle/nsis/SSOT Hub_${version}_x64-setup.exe" 'SSOT.Hub.windows.x64.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: SSOT.Hub.*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd dist
          ls SSOT.Hub.macos.arm64.tar.gz SSOT.Hub.windows.x64.exe
          sha256sum SSOT.Hub.* > SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
          gh release create "$TAG" SSOT.Hub.* SHA256SUMS --target "$GITHUB_SHA" --prerelease \
            --title "SSOT Hub ${TAG#v}" --notes "桌面预览版（macOS Apple Silicon / Windows x64）。下载、校验和安装见 docs/INSTALL.md。"
